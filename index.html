<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><title>Painel Eleitoral Brasil</title>
<style>
body{margin:0;background:#08101d;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:18px 16px;background:#0c1526;position:sticky;top:0;border-bottom:1px solid #263753;z-index:3}h1{margin:0;font-size:22px}.sub{color:#91a2c1;font-size:12px;margin-top:4px}main{max-width:1200px;margin:auto;padding:14px}.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;background:#101b2e;padding:12px;border-radius:16px}label{font-size:11px;color:#91a2c1}select,input,button{width:100%;padding:11px;border-radius:10px;border:1px solid #2b3e5d;background:#0a1424;color:white}button{background:#2869d8;font-weight:700}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card,.panel{background:#101b2e;border:1px solid #263753;border-radius:15px;padding:14px}.card span{font-size:10px;color:#91a2c1}.card b{display:block;font-size:20px;margin-top:5px}.panel{margin-top:10px}.bar{margin:9px 0}.line{display:flex;justify-content:space-between;font-size:12px}.track{height:10px;background:#091321;border-radius:10px;margin-top:4px}.fill{height:100%;background:#4f8cff;border-radius:10px}.table{overflow:auto;max-height:460px}table{border-collapse:collapse;width:100%;font-size:11px}td,th{padding:8px;border-bottom:1px solid #263753;white-space:nowrap;text-align:left}th{position:sticky;top:0;background:#15233b}.status{font-size:12px;color:#9fb0cb;margin:10px 0;padding:10px;background:#0d1728;border-radius:10px}@media(min-width:800px){.filters{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(6,1fr)}}
</style></head><body>
<header><h1>🗳️ Painel Eleitoral Brasil</h1><div class="sub">TSE • consulta por candidato, cidade, zona e seção</div></header><main>
<div class="status" id="status">Conecte esta interface à API configurando API_URL no código.</div>
<section class="filters">
<div><label>ANO</label><select id="ano"><option>Todos</option></select></div><div><label>TURNO</label><select id="turno"><option>Todos</option></select></div>
<div><label>CARGO</label><select id="cargo"><option>Todos</option></select></div><div><label>UF</label><select id="uf"><option>Todos</option></select></div>
<div><label>MUNICÍPIO</label><select id="municipio"><option>Todos</option></select></div><div><label>ZONA</label><select id="zona"><option>Todos</option></select></div>
<div><label>SEÇÃO</label><select id="secao"><option>Todos</option></select></div><div><label>CANDIDATO</label><select id="candidato"><option>Todos</option></select></div>
<div><label>PARTIDO</label><select id="partido"><option>Todos</option></select></div><div><label>BUSCA</label><input id="q" placeholder="candidato, cidade..."></div>
</section>
<div class="actions"><button onclick="load()">Pesquisar</button><button onclick="sync()">Atualizar do Drive</button><button onclick="location.reload()">Recarregar</button></div>
<section class="cards"><div class="card"><span>REGISTROS</span><b id="n">0</b></div><div class="card"><span>VOTOS</span><b id="v">0</b></div><div class="card"><span>CANDIDATOS</span><b id="c">0</b></div><div class="card"><span>MUNICÍPIOS</span><b id="m">0</b></div><div class="card"><span>ZONAS</span><b id="z">0</b></div><div class="card"><span>SEÇÕES</span><b id="s">0</b></div></section>
<section class="panel"><h2>Ranking</h2><div id="rank"></div></section>
<section class="panel"><h2>Detalhamento</h2><div class="table"><table><thead><tr><th>Ano</th><th>Turno</th><th>Cargo</th><th>UF</th><th>Município</th><th>Zona</th><th>Seção</th><th>Candidato</th><th>Partido</th><th>Votos</th></tr></thead><tbody id="body"></tbody></table></div></section>
</main><script>
const API_URL=localStorage.getItem("PAINEL_API_URL")||"http://localhost:8000";const fields=["ano","turno","cargo","uf","municipio","zona","secao","candidato","partido"];
const $=x=>document.getElementById(x), esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function opts(f){let r=await fetch(`${API_URL}/api/options?field=${f}`),j=await r.json(),s=$(f);s.innerHTML='<option>Todos</option>'+j.values.map(v=>`<option>${esc(v)}</option>`).join("")}
function params(){let p=new URLSearchParams();fields.forEach(f=>{if($(f).value!=="Todos")p.set(f,$(f).value)});if($("q").value)p.set("q",$("q").value);return p}
async function load(){try{let p=params(),[a,b,c]=await Promise.all([fetch(API_URL+"/api/summary?"+p),fetch(API_URL+"/api/ranking?"+p),fetch(API_URL+"/api/rows?limit=1000&"+p)]);let s=await a.json(),rank=await b.json(),rows=await c.json();["n","v","c","m","z","s"].forEach((id,i)=>$(id).textContent=Object.values(s)[i].toLocaleString("pt-BR"));let mx=rank[0]?.votos||1;$("rank").innerHTML=rank.map(x=>`<div class="bar"><div class="line"><span>${esc(x.candidato)}</span><b>${x.votos.toLocaleString("pt-BR")}</b></div><div class="track"><div class="fill" style="width:${x.votos/mx*100}%"></div></div></div>`).join("");$("body").innerHTML=rows.map(x=>`<tr>${["ano","turno","cargo","uf","municipio","zona","secao","candidato","partido","votos"].map(k=>`<td>${esc(x[k])}</td>`).join("")}</tr>`).join("");$("status").textContent=`API conectada: ${API_URL}`}catch(e){$("status").textContent="Não foi possível conectar à API. Verifique API_URL e o servidor."}}
async function sync(){let r=await fetch(API_URL+"/api/sync-drive",{method:"POST"}),j=await r.json();alert(j.ok?`Drive atualizado: ${j.registros_adicionados} registros adicionados.`:j.message);load()}
(async()=>{for(const f of fields)try{await opts(f)}catch{}load()})();
</script></body></html>
